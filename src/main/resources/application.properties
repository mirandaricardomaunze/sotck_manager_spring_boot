spring.application.name=stockmanager

spring.datasource.url=jdbc:postgresql://localhost:5432/stockmanager
spring.datasource.username=postgres
spring.datasource.password=1993

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.enable_lazy_load_no_transformation=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
